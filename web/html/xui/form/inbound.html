{{define "form/inbound"}}
<!-- base -->
<a-form layout="inline">
    <a-form-item label='{{ i18n "remark" }}'>
        <a-input v-model.trim="dbInbound.remark"></a-input>
    </a-form-item>
    <a-form-item label='{{ i18n "enable" }}'>
        <a-switch v-model="dbInbound.enable"></a-switch>
    </a-form-item>
    <a-form-item label='{{ i18n "protocol" }}'>
        <a-select v-model="inbound.protocol" style="width: 160px;">
            <a-select-option v-for="p in selectableProtocols()" :key="p" :value="p">[[ p ]]</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            监听 IP
            <a-tooltip>
                <template slot="title">
                    默认留空即可
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-input v-model.trim="inbound.listen"></a-input>
    </a-form-item>
    <a-form-item label="端口">
        <a-input type="number" v-model.number="inbound.port"></a-input>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            总流量(GB)
            <a-tooltip>
                <template slot="title">
                    0 表示不限制
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-input-number v-model="dbInbound.totalGB" :min="0"></a-input-number>
    </a-form-item>
    <a-form-item>
        <span slot="label">
            到期时间
            <a-tooltip>
                <template slot="title">
                    留空则永不到期
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                       v-model="dbInbound._expiryTime" style="width: 300px;"></a-date-picker>
    </a-form-item>
</a-form>

<a-alert v-if="legacyProtocolWarning()"
         type="warning"
         show-icon
         :message="legacyProtocolWarning()"
         style="margin-bottom: 16px;"></a-alert>

<a-alert v-if="legacyNetworkWarning()"
         type="warning"
         show-icon
         :message="legacyNetworkWarning()"
         style="margin-bottom: 16px;"></a-alert>

<a-alert v-if="legacyFlowWarning()"
         type="warning"
         show-icon
         :message="legacyFlowWarning()"
         style="margin-bottom: 16px;"></a-alert>

<a-alert v-if="legacyVMessWarning()"
         type="warning"
         show-icon
         :message="legacyVMessWarning()"
         style="margin-bottom: 16px;"></a-alert>

<a-alert v-if="inbound.protocol === Protocols.HTTP && inbound.stream.security === 'tls'"
         type="info"
         show-icon
         message="HTTP + TLS"
         description="HTTP (HTTPS Mode)"
         style="margin-bottom: 16px;"></a-alert>

<!-- protocol settings -->
<template v-if="isSchemaProtocol(inbound.protocol)">
    {{template "form/protocolSchema"}}
</template>

<!-- dokodemo-door -->
<template v-if="inbound.protocol === Protocols.DOKODEMO">
    {{template "form/dokodemo"}}
</template>

<!-- tunnel -->
<template v-if="inbound.protocol === Protocols.TUNNEL">
    {{template "form/dokodemo"}}
</template>

<!-- socks -->
<template v-if="inbound.protocol === Protocols.SOCKS">
    {{template "form/socks"}}
</template>

<!-- http -->
<template v-if="inbound.protocol === Protocols.HTTP">
    {{template "form/http"}}
</template>

<!-- stream settings -->
<template v-if="inbound.canEnableStream()">
    {{template "form/streamSettings"}}
</template>

<!-- tls settings -->
<template v-if="inbound.canEnableTls()">
    {{template "form/tlsSettings"}}
</template>

{{end}}
