{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        confirm: null,
        protocolSchemas: {},
        protocolSchema: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.loadProtocolSchema(this.inbound.protocol);
            this.visible = true;
        },
        async loadProtocolSchema(protocol) {
            if (this.protocolSchemas[protocol]) {
                this.protocolSchema = this.protocolSchemas[protocol];
                return;
            }
            const msg = await HttpUtil.get(`/api/protocol/schema/${protocol}`);
            if (!msg.success) {
                this.protocolSchema = null;
                return;
            }
            this.protocolSchemas[protocol] = msg.obj;
            this.protocolSchema = msg.obj;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        DOKODEMO: Protocols.DOKODEMO,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
        MIXED: Protocols.MIXED,
        TUNNEL: Protocols.TUNNEL,
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            }
        },
        methods: {
            isSchemaProtocol(protocol) {
                return [
                    Protocols.VMESS,
                    Protocols.VLESS,
                    Protocols.TROJAN,
                    Protocols.SHADOWSOCKS,
                    Protocols.MIXED,
                ].includes(protocol);
            },
            selectableProtocols() {
                const ordered = [
                    Protocols.VMESS,
                    Protocols.VLESS,
                    Protocols.TROJAN,
                    Protocols.SHADOWSOCKS,
                    Protocols.DOKODEMO,
                    Protocols.SOCKS,
                    Protocols.HTTP,
                    Protocols.MIXED,
                    Protocols.TUNNEL,
                ];
                const options = ordered.filter(protocol => !LegacyProtocols.includes(protocol));
                if (this.inbound.isLegacyProtocol() && !options.includes(this.inbound.protocol)) {
                    options.push(this.inbound.protocol);
                }
                return options;
            },
            selectableNetworks() {
                const options = ['tcp', 'ws', 'xhttp', 'grpc'];
                if (this.inbound.isLegacyNetwork()) {
                    if (this.inbound.network === 'http' || this.inbound.network === 'splithttp') {
                        if (!options.includes('http')) {
                            options.push('http');
                        }
                    } else if (!options.includes(this.inbound.network)) {
                        options.push(this.inbound.network);
                    }
                }
                return options;
            },
            legacyProtocolWarning() {
                if (!this.inbound.isLegacyProtocol()) {
                    return '';
                }
                return `当前协议 ${this.inbound.protocol} 为 Legacy / 兼容模式，仅支持读取与兼容保存，不再作为新建推荐选项。`;
            },
            legacyNetworkWarning() {
                if (!this.inbound.isLegacyNetwork()) {
                    return '';
                }
                if (['http', 'splithttp'].includes(this.inbound.network)) {
                    return '当前传输为 Legacy / 兼容模式，保存时将统一归一化为 xhttp。';
                }
                return `当前传输 ${this.inbound.network} 为 Legacy / 兼容模式，仅支持读取与兼容保存。`;
            },
            legacyFlowWarning() {
                return this.inbound.legacyFlowWarning();
            },
            legacyVMessWarning() {
                return this.inbound.legacyVMessWarning();
            },
            async generateRealityKeyPair() {
                const msg = await HttpUtil.post('/api/protocol/reality/keypair');
                if (!msg.success) {
                    return;
                }
                this.inbound.stream.reality.privateKey = msg.obj.privateKey;
                this.inbound.stream.reality.publicKey = msg.obj.publicKey;
            },
            generateRealityShortIds() {
                this.inbound.stream.reality.shortIds = [this.randomHex(8)];
            },
            randomHex(length) {
                const alphabet = '0123456789abcdef';
                let value = '';
                const bytes = new Uint8Array(length);
                window.crypto.getRandomValues(bytes);
                for (let i = 0; i < bytes.length; i++) {
                    value += alphabet[bytes[i] % alphabet.length];
                }
                return value;
            },
            protocolField(field) {
                const settings = this.inbound.settings;
                return {
                    get value() {
                        return settings.get(field.name, field.default);
                    },
                    set value(value) {
                        settings.set(field.name, value);
                    }
                };
            },
            isVisibleProtocolField(field) {
                if (field.type === 'hidden') {
                    return false;
                }
                if (field.name === 'clients.0.flow') {
                    return this.inbound.canEnableVision();
                }
                return true;
            },
            streamNetworkChange(oldValue) {
                if (['http', 'splithttp'].includes(oldValue)) {
                    this.inModal.inbound.stream.network = 'xhttp';
                }
            }
        },
        watch: {
            'inModal.inbound.protocol'(protocol) {
                this.inModal.loadProtocolSchema(protocol);
            }
        }
    });

</script>
{{end}}
